openapi: 3.1.0
info:
  title: Agent Canvas API
  version: 0.1.0
  description: HTTP contract for the Agent Canvas engineering baseline.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          description: Service is ready.
        "503":
          description: Service is not ready.
  /projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    CreateProjectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    Project:
      type: object
      required: [id, title, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
