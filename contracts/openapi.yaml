openapi: 3.1.0
info:
  title: Agent Canvas API
  version: 0.1.0
  description: HTTP contract for the Agent Canvas engineering baseline.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          description: Service is ready.
        "503":
          description: Service is not ready.
  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects ordered by most recently updated.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectSummary"
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      responses:
        "200":
          description: Project snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project metadata updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      responses:
        "204":
          description: Project deleted.
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/operations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: applyCanvasOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyOperationsRequest"
      responses:
        "200":
          description: The operation batch was applied atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyOperationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RevisionConflict"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RevisionConflict:
      description: The project revision does not match expectedRevision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RevisionConflictError"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    CreateProjectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    UpdateProjectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    RevisionConflictError:
      type: object
      required: [code, message, currentRevision]
      properties:
        code:
          type: string
          enum: [revision_conflict]
        message:
          type: string
        currentRevision:
          type: integer
          minimum: 1
    Project:
      type: object
      required: [id, title, revision, snapshot, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        revision: { type: integer, minimum: 1 }
        snapshot:
          $ref: "#/components/schemas/CanvasSnapshot"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectSummary:
      type: object
      required: [id, title, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CanvasSnapshot:
      type: object
      required: [nodes, edges, viewport]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/CanvasNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/CanvasEdge"
        viewport:
          $ref: "#/components/schemas/CanvasViewport"
    CanvasNode:
      type: object
      required: [id, type, title, position, size, data]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        type:
          type: string
          enum: [text]
        title: { type: string, maxLength: 200 }
        position:
          $ref: "#/components/schemas/CanvasPoint"
        size:
          $ref: "#/components/schemas/CanvasSize"
        data:
          $ref: "#/components/schemas/TextNodeData"
    CanvasEdge:
      type: object
      required: [id, source, target]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
    CanvasPoint:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
    CanvasSize:
      type: object
      required: [width, height]
      properties:
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    CanvasViewport:
      type: object
      required: [x, y, zoom]
      properties:
        x: { type: number }
        y: { type: number }
        zoom: { type: number, minimum: 0.1, maximum: 4 }
    TextNodeData:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
    NodeCreateOperation:
      type: object
      required: [type, node]
      properties:
        type:
          type: string
          const: node.create
        node:
          $ref: "#/components/schemas/CanvasNode"
    NodeUpdateOperation:
      type: object
      required: [type, nodeId]
      properties:
        type:
          type: string
          const: node.update
        nodeId: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, maxLength: 200 }
        data:
          $ref: "#/components/schemas/TextNodeData"
    NodeMoveOperation:
      type: object
      required: [type, nodeId, position]
      properties:
        type:
          type: string
          const: node.move
        nodeId: { type: string, minLength: 1, maxLength: 64 }
        position:
          $ref: "#/components/schemas/CanvasPoint"
    NodeDeleteOperation:
      type: object
      required: [type, nodeId]
      properties:
        type:
          type: string
          const: node.delete
        nodeId: { type: string, minLength: 1, maxLength: 64 }
    EdgeCreateOperation:
      type: object
      required: [type, edge]
      properties:
        type:
          type: string
          const: edge.create
        edge:
          $ref: "#/components/schemas/CanvasEdge"
    EdgeDeleteOperation:
      type: object
      required: [type, edgeId]
      properties:
        type:
          type: string
          const: edge.delete
        edgeId: { type: string, minLength: 1, maxLength: 64 }
    ApplyOperationsRequest:
      type: object
      required: [requestId, expectedRevision, operations]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 64 }
        expectedRevision: { type: integer, minimum: 1 }
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: "#/components/schemas/NodeCreateOperation"
              - $ref: "#/components/schemas/NodeUpdateOperation"
              - $ref: "#/components/schemas/NodeMoveOperation"
              - $ref: "#/components/schemas/NodeDeleteOperation"
              - $ref: "#/components/schemas/EdgeCreateOperation"
              - $ref: "#/components/schemas/EdgeDeleteOperation"
            discriminator:
              propertyName: type
    ApplyOperationsResponse:
      type: object
      required: [revision, project]
      properties:
        revision: { type: integer, minimum: 2 }
        project:
          $ref: "#/components/schemas/Project"
